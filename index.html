<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>ACCESS NODE</title>

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:black;
color:#00fff7;
font-family:'Share Tech Mono', monospace;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

/* GRID CYBER */

body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background-image:
linear-gradient(rgba(0,255,255,0.08) 1px, transparent 1px),
linear-gradient(90deg, rgba(0,255,255,0.08) 1px, transparent 1px);
background-size:40px 40px;
animation:gridMove 15s linear infinite;
}

@keyframes gridMove{
0%{transform:translateY(0)}
100%{transform:translateY(40px)}
}

/* SCANLINES */

body::after{
content:"";
position:fixed;
width:100%;
height:100%;
background:repeating-linear-gradient(
transparent,
transparent 2px,
rgba(0,0,0,0.35) 3px
);
pointer-events:none;
}

/* CONTAINER */

.container{
text-align:center;
z-index:2;
max-width:700px;
position:relative;
}

/* EYES */

.eyes{
width:420px;
max-width:80vw;
margin-bottom:40px;
filter:contrast(120%) brightness(110%);
animation:glitchEyes 4s infinite;
}

@keyframes glitchEyes{
0%{transform:translate(0)}
10%{transform:translate(-3px,2px)}
20%{transform:translate(3px,-2px)}
30%{transform:translate(-2px,1px)}
40%{transform:translate(2px,-1px)}
50%{transform:translate(0)}
60%{filter:hue-rotate(20deg)}
70%{filter:hue-rotate(-20deg)}
80%{transform:translate(1px,-1px)}
90%{transform:translate(-1px,1px)}
100%{transform:translate(0)}
}

/* SCANNER */

.scanner{
position:absolute;
left:0;
width:100%;
height:2px;
background:#00fff7;
box-shadow:0 0 15px #00fff7;
animation:scan 4s linear infinite;
}

@keyframes scan{
0%{top:0}
100%{top:100%}
}

/* SUBTITLE */

.subtitle{
margin-top:20px;
font-size:18px;
color:#00a6a6;
}

/* TYPING */

.typing{
margin-top:40px;
font-size:20px;
min-height:60px;
}

/* BUTTON */

button{
margin-top:40px;
padding:14px 30px;
background:transparent;
border:1px solid #00fff7;
color:#00fff7;
font-family:'Share Tech Mono';
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#00fff7;
color:black;
box-shadow:0 0 20px #00fff7;
}

/* PARTICLES */

canvas{
position:fixed;
top:0;
left:0;
pointer-events:none;
z-index:1;
}

</style>
</head>

<body>

<canvas id="particles"></canvas>

<div class="container">

<div style="position:relative;display:inline-block;">
<img class="eyes" src="https://i.imgur.com/7ftC0qJ.jpeg">
<div class="scanner"></div>
</div>

<div class="subtitle">
ToMyManda.com
</div>

<div class="typing" id="text"></div>

<button onclick="reveal()">OPEN TRANSMISSION</button>

</div>

<script>

const message =
"No meio de todo esse ruído... \
você foi o único sinal claro. \
Se existe alguém com quem eu escolheria atravessar qualquer realidade... \
é você.";

let i = 0;

function typeWriter(){
if(i < message.length){
document.getElementById("text").innerHTML += message.charAt(i);
i++;
setTimeout(typeWriter,40);
}
}

typeWriter();

/* INTERFACE 2 */

function reveal(){

document.querySelector(".container").innerHTML = `
<h2 style="color:#00fff7;text-shadow:0 0 10px #00fff7;">
CONNECTION ESTABLISHED
</h2>

<p style="margin-top:30px;font-size:20px;">
Sistema reconheceu o usuário:<br><br>
Amanda
</p>

<p style="margin-top:30px;">
Status: prioridade máxima
</p>

<button onclick="location.reload()">REBOOT</button>
`;

}

/* PARTICLES */

const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

document.addEventListener("mousemove", e=>{
particles.push({
x:e.clientX,
y:e.clientY,
life:60
});
});

function animateParticles(){

ctx.clearRect(0,0,canvas.width,canvas.height);

for(let i=0;i<particles.length;i++){

let p = particles[i];

ctx.fillStyle="#00fff7";
ctx.fillRect(p.x,p.y,2,2);

p.life--;

if(p.life<=0){
particles.splice(i,1);
i--;
}

}

requestAnimationFrame(animateParticles);
}

animateParticles();

</script>

</body>
</html>
