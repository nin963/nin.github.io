<!DOCTYPE html>
<html>
<head>
<title>Para você</title>

<style>
body{
background:#0b0b0b;
color:#d0c6d8;
font-family: "Times New Roman", serif;
text-align:center;
margin-top:120px;
}

h1{
color:#b3003c;
font-size:50px;
letter-spacing:3px;
}

p{
font-size:20px;
}

button{
padding:15px;
font-size:18px;
background:black;
color:#b3003c;
border:1px solid #b3003c;
cursor:pointer;
}

button:hover{
background:#1a0010;
}

</style>

</head>

<body>

<h1>Para você</h1>

<p>
Entre todas as noites silenciosas do mundo,  
foi você que trouxe luz para a minha.
</p>

<button onclick="mostrar()">Leia mais</button>

<p id="msg"></p>

<script>
function mostrar(){
document.getElementById("msg").innerHTML =
"Mesmo na escuridão mais profunda, eu escolheria caminhar ao seu lado.";
}
</script>

</body>
</html>
